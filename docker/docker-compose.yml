# ===========================================
# PubMatcher - Standalone Docker Deployment
# ===========================================
# This file provides a complete standalone deployment
# with PostgreSQL included (no external dependencies)
#
# Usage (from project root):
#   docker-compose -f docker/docker-compose.yml up -d
#
# Or from docker/ folder:
#   cd docker && docker-compose up -d
#
# First time setup:
#   1. Copy env.example.txt to .env and configure (in project root)
#   2. Run: docker-compose -f docker/docker-compose.yml up -d
#   3. Access: http://localhost:3000
# ===========================================

version: '3.8'

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  db:
    image: postgres:14-alpine
    container_name: pubmatcher_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pubmatcher}
      POSTGRES_USER: ${DB_USER:-pubmatcher}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pubmatcher} -d ${DB_NAME:-pubmatcher}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pubmatcher_network

  # ===========================================
  # PubMatcher Application
  # ===========================================
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pubmatcher_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-pubmatcher}
      - DB_USER=${DB_USER:-pubmatcher}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_in_production}
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../logs:/app/logs
    networks:
      - pubmatcher_network

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    driver: local

# ===========================================
# Networks
# ===========================================
networks:
  pubmatcher_network:
    driver: bridge
